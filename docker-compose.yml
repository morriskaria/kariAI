version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kariaai-postgres
    environment:
      POSTGRES_USER: kariaai_user
      POSTGRES_PASSWORD: kariaai_password_secure
      POSTGRES_DB: kariaai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kariaai_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kariaai-network

  # Redis (optional, for caching and queues)
  redis:
    image: redis:7-alpine
    container_name: kariaai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kariaai-network

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kariaai-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://kariaai_user:kariaai_password_secure@postgres:5432/kariaai_db
      JWT_SECRET: your_jwt_secret_key_change_in_production
      JWT_EXPIRATION: 3600
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    networks:
      - kariaai-network

volumes:
  postgres_data:
  redis_data:

networks:
  kariaai-network:
    driver: bridge
